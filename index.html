<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area 30 - Display TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* Sfondo bianco ovunque */
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Barra superiore fissa */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10000;
            border-bottom: 2px solid #00aaff;
        }
        #header-title {
            font-size: 34px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #clock-container {
            text-align: right;
        }
        #clock-time {
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
        }
        #clock-date {
            font-size: 18px;
            color: #ccc;
            margin-top: 4px;
        }

        /* Contenitori principali spostati sotto la barra */
        .container {
            width: 100%;
            height: calc(100% - 80px);
            position: absolute;
            top: 80px;
            left: 0;
            display: none;
            background-color: #ffffff; /* Sfondo bianco */
        }
        .active {
            display: block;
        }

        /* Video con fasce bianche */
        #step-video {
            background-color: #ffffff;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene proporzioni, le parti vuote prendono il background */
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Meteo ancorato in alto e zoomato */
        #step-meteo {
            background-color: #ffffff;
            overflow: hidden;
        }
        #step-meteo iframe {
            transform: scale(1.5);
            transform-origin: top center; /* Lo tiene agganciato in alto */
        }

        /* Barra di progressione in basso */
        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            display: none;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00aaff;
            transition: none;
        }
    </style>
</head>
<body>

    <!-- Barra superiore fissa -->
    <div id="top-bar">
        <div id="header-title">Centro Medico Sommariva Bosco</div>
        <div id="clock-container">
            <div id="clock-time"></div>
            <div id="clock-date"></div>
        </div>
    </div>

    <!-- Barra di caricamento -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 1. SEZIONE VIDEO -->
    <div id="step-video" class="container active">
        <!-- Rimosso loop per sicurezza -->
        <video id="localVideo" autoplay muted playsinline>
            <source src="VIDEO TV CENTRO MEDICO (Video).mp4" type="video/mp4">
        </video>
    </div>

    <!-- 2. SEZIONE METEO -->
    <div id="step-meteo" class="container">
        <iframe src="https://area30music.github.io/meteosommariva/"></iframe>
    </div>

    <!-- 3. SEZIONE NEWS -->
    <div id="step-news" class="container">
        <iframe src="https://area30music.github.io/newssommarivabosco/"></iframe>
    </div>

    <script>
        // Orologio e Data in tempo reale (Versione ultra-compatibile per Smart TV)
        function updateClock() {
            var now = new Date();
            
            // Orario
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').textContent = hours + ':' + minutes + ':' + seconds;
            
            // Data
            var options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
            var dateString = now.toLocaleDateString('it-IT', options);
            if (dateString && dateString.length > 0) {
                dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            }
            document.getElementById('clock-date').textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Gestione Sequenza
        var videoStep = document.getElementById('step-video');
        var meteoStep = document.getElementById('step-meteo');
        var newsStep = document.getElementById('step-news');
        var localVideo = document.getElementById('localVideo');
        var progressBarContainer = document.getElementById('progress-bar-container');
        var progressBar = document.getElementById('progress-bar');

        var meteoDuration = 60000;   // 60 secondi
        var newsDuration = 255000;   // 4 minuti e 15 secondi
        var isVideoPlaying = false;  // Flag di sicurezza

        function startSequence() {
            progressBarContainer.style.display = 'none';
            videoStep.classList.add('active');
            meteoStep.classList.remove('active');
            newsStep.classList.remove('active');
            isVideoPlaying = true;
            
            localVideo.currentTime = 0;
            
            var playPromise = localVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(e) {
                    console.log("Autoplay bloccato:", e);
                    showMeteo();
                });
            }
        }

        // Passaggio standard a fine video
        localVideo.addEventListener('ended', showMeteo);

        // FALLBACK INFALLIBILE PER TV: controlla costantemente a che punto è il video
        localVideo.addEventListener('timeupdate', function() {
            // Se mancano meno di 0.5 secondi alla fine del video, forza il passaggio
            if (isVideoPlaying && localVideo.duration > 0) {
                if (localVideo.currentTime >= localVideo.duration - 0.5) {
                    showMeteo();
                }
            }
        });

        function showMeteo() {
            if (meteoStep.classList.contains('active')) return;
            isVideoPlaying = false; // Ferma il controllo timeupdate
            
            videoStep.classList.remove('active');
            meteoStep.classList.add('active');
            newsStep.classList.remove('active');
            
            startProgress(meteoDuration);
            setTimeout(showNews, meteoDuration);
        }

        function showNews() {
            videoStep.classList.remove('active');
            meteoStep.classList.remove('active');
            newsStep.classList.add('active');
            
            startProgress(newsDuration);
            setTimeout(startSequence, newsDuration);
        }

        function startProgress(duration) {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            progressBarContainer.style.display = 'block';
            
            void progressBar.offsetWidth; // Forza l'aggiornamento grafico
            
            progressBar.style.transition = 'width ' + duration + 'ms linear';
            progressBar.style.width = '100%';
        }

        // Riavvio quotidiano alle 08:55
        setInterval(function() {
            var now = new Date();
            if (now.getHours() === 8 && now.getMinutes() === 55) {
                location.reload();
            }
        }, 60000);

        window.onload = function() {
            startSequence();
        };
    </script>
</body>
</html>
