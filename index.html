<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area 30 - Display TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Barra superiore fissa */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10000;
            border-bottom: 2px solid #00aaff;
        }
        #header-title {
            font-size: 34px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #clock-container {
            text-align: right;
        }
        #clock-time {
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
        }
        #clock-date {
            font-size: 18px;
            color: #ccc;
            margin-top: 4px;
        }

        /* Contenitori principali */
        .container {
            width: 100%;
            height: calc(100% - 80px);
            position: absolute;
            top: 80px;
            left: 0;
            display: none;
            background-color: #ffffff;
        }
        .active {
            display: block;
        }

        /* Video a schermo intero senza bande laterali */
        #step-video {
            background-color: #ffffff;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Se preferisci che non tagli nulla ma si adatti leggermente, usa 'fill' */
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Ridimensionamento e centratura del Meteo */
        #step-meteo {
            background-color: #ffffff;
            overflow: hidden;
        }
        #step-meteo iframe {
            transform: scale(1.4);
            transform-origin: center 20%;
        }

        /* Barra di progressione in basso */
        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            display: none;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00aaff;
            transition: none;
        }
    </style>
</head>
<body>

    <!-- Barra superiore fissa -->
    <div id="top-bar">
        <div id="header-title">Centro Medico Sommariva Bosco</div>
        <div id="clock-container">
            <div id="clock-time"></div>
            <div id="clock-date"></div>
        </div>
    </div>

    <!-- Barra di caricamento -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 1. SEZIONE VIDEO -->
    <div id="step-video" class="container active">
        <video id="localVideo" autoplay muted playsinline>
            <source src="VIDEO TV CENTRO MEDICO (Video).mp4" type="video/mp4">
            Il tuo browser non supporta il formato video.
        </video>
    </div>

    <!-- 2. SEZIONE METEO -->
    <div id="step-meteo" class="container">
        <iframe src="https://area30music.github.io/meteosommariva/"></iframe>
    </div>

    <!-- 3. SEZIONE NEWS -->
    <div id="step-news" class="container">
        <iframe src="https://area30music.github.io/newssommarivabosco/"></iframe>
    </div>

    <script>
        // Orologio e Data in tempo reale
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const dateOptions = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
            
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('it-IT', timeOptions);
            
            let dateString = now.toLocaleDateString('it-IT', dateOptions);
            dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            document.getElementById('clock-date').textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Gestione Sequenza
        const videoStep = document.getElementById('step-video');
        const meteoStep = document.getElementById('step-meteo');
        const newsStep = document.getElementById('step-news');
        const localVideo = document.getElementById('localVideo');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');

        const meteoDuration = 60000; // 60 secondi
        const newsDuration = 255000;  // 4 minuti e 15 secondi
        let videoFallbackTimer = null;

        function startSequence() {
            progressBarContainer.style.display = 'none';
            videoStep.classList.add('active');
            meteoStep.classList.remove('active');
            newsStep.classList.remove('active');
            
            localVideo.currentTime = 0;

                    console.log("Autoplay bloccato:", e);
                    showMeteo();
                });
            }
        }
