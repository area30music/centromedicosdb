<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area 30 - Display TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Barra superiore fissa */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10000;
            border-bottom: 2px solid #00aaff;
        }
        #header-title {
            font-size: 34px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #clock-container { text-align: right; }
        #clock-time {
            font-size: 40px;
            font-weight: bold;
            line-height: 1;
        }
        #clock-date {
            font-size: 18px;
            color: #ccc;
            margin-top: 4px;
        }

        /* Contenitori principali sotto la barra */
        .container {
            width: 100%;
            height: calc(100% - 80px);
            position: absolute;
            top: 80px;
            left: 0;
            display: none;
            background-color: #ffffff;
            overflow: hidden;
        }
        .active { display: block; }

        /* VIDEO: la cornice ha esattamente le proporzioni del video,
           quindi tutto lo spazio intorno resta BIANCO (anche sulle TV
           che dipingono di nero l'area vuota del tag <video>) */
        #video-frame {
            position: absolute;
            overflow: hidden;
            background: transparent;
        }
        #localVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            background: transparent;
        }

        /* Iframe news */
        #step-news iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* METEO: dimensioni e zoom calcolati via JavaScript
           per riempire tutto lo spazio senza tagliare nulla */
        #meteo-frame {
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            -webkit-transform-origin: 0 0;
            transform-origin: 0 0;
        }

        /* Barra di progressione in basso */
        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            display: none;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00aaff;
            transition: none;
        }
    </style>
</head>
<body>

    <!-- Barra superiore fissa -->
    <div id="top-bar">
        <div id="header-title">Centro Medico Sommariva Bosco</div>
        <div id="clock-container">
            <div id="clock-time"></div>
            <div id="clock-date"></div>
        </div>
    </div>

    <!-- Barra di caricamento -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 1. SEZIONE VIDEO -->
    <div id="step-video" class="container active">
        <div id="video-frame">
            <video id="localVideo" autoplay muted playsinline>
                <source src="VIDEO TV CENTRO MEDICO (Video).mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- 2. SEZIONE METEO -->
    <div id="step-meteo" class="container">
        <iframe id="meteo-frame" src="https://area30music.github.io/meteosommariva/"></iframe>
    </div>

    <!-- 3. SEZIONE NEWS -->
    <div id="step-news" class="container">
        <iframe src="https://area30music.github.io/newssommarivabosco/"></iframe>
    </div>

    <script>
        /* ================= IMPOSTAZIONI ================= */

        // Se le fasce nere sono "dentro" il file video (cioè fanno parte
        // del filmato stesso), indica qui quanta larghezza tagliare per
        // ogni lato, in percentuale. Esempio: 12.5 per un video 4:3
        // esportato in 16:9. Lascia 0 se il video non ha bande incise.
        var TAGLIO_LATI_PERCENTO = 0;

        // Zoom del meteo: 1 = normale. Aumenta (es. 1.5) per ingrandire
        // i contenuti, diminuisci se qualcosa esce dallo schermo.
        // La pagina riempie comunque sempre tutto lo spazio disponibile.
        var ZOOM_METEO = 1.35;

        var ALTEZZA_BARRA = 80;
        var meteoDuration = 60000;   // 60 secondi
        var newsDuration = 255000;   // 4 minuti e 15 secondi

        /* ================================================ */

        function pad(n) { return (n < 10 ? '0' : '') + n; }

        // Orologio e data
        function updateClock() {
            var now = new Date();
            document.getElementById('clock-time').textContent =
                pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

            var options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
            var dateString = now.toLocaleDateString('it-IT', options);
            if (dateString && dateString.length > 0) {
                dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            }
            document.getElementById('clock-date').textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        var videoStep = document.getElementById('step-video');
        var meteoStep = document.getElementById('step-meteo');
        var newsStep = document.getElementById('step-news');
        var videoFrame = document.getElementById('video-frame');
        var localVideo = document.getElementById('localVideo');
        var meteoFrame = document.getElementById('meteo-frame');
        var progressBarContainer = document.getElementById('progress-bar-container');
        var progressBar = document.getElementById('progress-bar');
        var isVideoPlaying = false;

        // Dimensiona il video alle sue proporzioni reali, centrato su fondo bianco
        function fitVideo() {
            var vw = localVideo.videoWidth;
            var vh = localVideo.videoHeight;
            var cw = window.innerWidth;
            var ch = window.innerHeight - ALTEZZA_BARRA;
            if (!vw || !vh) {
                // Metadati non ancora pronti: occupa tutto per ora
                videoFrame.style.left = '0px';
                videoFrame.style.top = '0px';
                videoFrame.style.width = cw + 'px';
                videoFrame.style.height = ch + 'px';
                localVideo.style.objectFit = 'contain';
                return;
            }
            localVideo.style.objectFit = 'fill';

            // Larghezza "utile" del video escludendo eventuali bande incise
            var taglio = TAGLIO_LATI_PERCENTO / 100;
            var vwUtile = vw * (1 - 2 * taglio);

            var s = Math.min(cw / vwUtile, ch / vh);
            var wPieno = vw * s;               // larghezza video intero
            var wVisibile = vwUtile * s;       // larghezza dopo il taglio
            var h = vh * s;
            var crop = wPieno * taglio;

            videoFrame.style.width = Math.round(wVisibile) + 'px';
            videoFrame.style.height = Math.round(h) + 'px';
            videoFrame.style.left = Math.round((cw - wVisibile) / 2) + 'px';
            videoFrame.style.top = Math.round((ch - h) / 2) + 'px';

            localVideo.style.width = Math.round(wPieno) + 'px';
            localVideo.style.height = Math.round(h) + 'px';
            localVideo.style.left = Math.round(-crop) + 'px';
        }

        // Il meteo viene impaginato su uno schermo "virtuale" più piccolo
        // e poi ingrandito per riempire esattamente tutto lo spazio
        function fitMeteo() {
            var cw = window.innerWidth;
            var ch = window.innerHeight - ALTEZZA_BARRA;
            var z = ZOOM_METEO > 0 ? ZOOM_METEO : 1;
            meteoFrame.style.width = Math.ceil(cw / z) + 'px';
            meteoFrame.style.height = Math.ceil(ch / z) + 'px';
            meteoFrame.style.webkitTransform = 'scale(' + z + ')';
            meteoFrame.style.transform = 'scale(' + z + ')';
        }

        function fitAll() { fitVideo(); fitMeteo(); }
        localVideo.addEventListener('loadedmetadata', fitVideo);
        window.addEventListener('resize', fitAll);
        fitAll();

        function startSequence() {
            progressBarContainer.style.display = 'none';
            videoStep.classList.add('active');
            meteoStep.classList.remove('active');
            newsStep.classList.remove('active');
            isVideoPlaying = true;
            fitVideo();

            localVideo.currentTime = 0;

            var playPromise = localVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(function (e) {
                    console.log("Autoplay bloccato:", e);
                    showMeteo();
                });
            }
        }

        localVideo.addEventListener('ended', showMeteo);

        // Fallback per TV: forza il passaggio a fine video
        localVideo.addEventListener('timeupdate', function () {
            if (isVideoPlaying && localVideo.duration > 0) {
                if (localVideo.currentTime >= localVideo.duration - 0.5) {
                    showMeteo();
                }
            }
        });

        function showMeteo() {
            if (meteoStep.classList.contains('active')) return;
            isVideoPlaying = false;

            videoStep.classList.remove('active');
            meteoStep.classList.add('active');
            newsStep.classList.remove('active');
            fitMeteo();

            startProgress(meteoDuration);
            setTimeout(showNews, meteoDuration);
        }

        function showNews() {
            videoStep.classList.remove('active');
            meteoStep.classList.remove('active');
            newsStep.classList.add('active');

            startProgress(newsDuration);
            setTimeout(startSequence, newsDuration);
        }

        function startProgress(duration) {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            progressBarContainer.style.display = 'block';

            void progressBar.offsetWidth;

            progressBar.style.transition = 'width ' + duration + 'ms linear';
            progressBar.style.width = '100%';
        }

        // Riavvio quotidiano alle 08:55
        setInterval(function () {
            var now = new Date();
            if (now.getHours() === 8 && now.getMinutes() === 55) {
                location.reload();
            }
        }, 60000);

        window.onload = function () {
            fitAll();
            startSequence();
        };
    </script>
</body>
</html>
