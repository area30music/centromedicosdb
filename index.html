<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area 30 - Display TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }
        .active {
            display: block;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Zoom maggiorato per il meteo */
        #step-meteo iframe {
            transform: scale(1.6);
            transform-origin: center center;
        }

        /* Barra di progressione fissata in basso */
        #progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: none;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00aaff;
            transition: none;
        }
    </style>
</head>
<body>

    <!-- Barra di caricamento -->
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <!-- 1. SEZIONE VIDEO -->
    <div id="step-video" class="container active">
        <!-- Assicurati che non ci sia l'attributo 'loop' nel tag video -->
        <video id="localVideo" autoplay muted playsinline>
            <source src="VIDEO TV CENTRO MEDICO (Video).mp4" type="video/mp4">
            Il tuo browser non supporta il formato video.
        </video>
    </div>

    <!-- 2. SEZIONE METEO -->
    <div id="step-meteo" class="container">
        <iframe src="https://area30music.github.io/meteosommariva/"></iframe>
    </div>

    <!-- 3. SEZIONE NEWS -->
    <div id="step-news" class="container">
        <iframe src="https://area30music.github.io/newssommarivabosco/"></iframe>
    </div>

    <script>
        const videoStep = document.getElementById('step-video');
        const meteoStep = document.getElementById('step-meteo');
        const newsStep = document.getElementById('step-news');
        const localVideo = document.getElementById('localVideo');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const progressBar = document.getElementById('progress-bar');

        const meteoDuration = 120000; // 2 minuti in millisecondi
        const newsDuration = 255000;  // 4 minuti e 15 secondi in millisecondi
        let videoFallbackTimer = null;

        function startSequence() {
            progressBarContainer.style.display = 'none';
            videoStep.classList.add('active');
            meteoStep.classList.remove('active');
            newsStep.classList.remove('active');
            
            localVideo.currentTime = 0;
            
            const playPromise = localVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log("Autoplay bloccato:", e);
                    showMeteo();
                });
            }
        }

        // Passaggio al meteo quando il video finisce (evento standard)
        localVideo.addEventListener('ended', showMeteo);

        // Sistema di sicurezza se l'evento 'ended' si blocca sulla TV
        localVideo.addEventListener('play', () => {
            clearTimeout(videoFallbackTimer);
            if(localVideo.duration && localVideo.duration > 0 && localVideo.duration !== Infinity) {
                videoFallbackTimer = setTimeout(() => {
                    if (videoStep.classList.contains('active')) {
                        showMeteo();
                    }
                }, (localVideo.duration * 1000) + 1000); // Aggiunge 1 secondo di margine alla durata
            }
        });

        function showMeteo() {
            if (meteoStep.classList.contains('active')) return; // Evita di far partire il timer due volte
            
            clearTimeout(videoFallbackTimer);
            videoStep.classList.remove('active');
            meteoStep.classList.add('active');
            newsStep.classList.remove('active');
            
            startProgress(meteoDuration);
            setTimeout(showNews, meteoDuration);
        }

        function showNews() {
            videoStep.classList.remove('active');
            meteoStep.classList.remove('active');
            newsStep.classList.add('active');
            
            startProgress(newsDuration);
            setTimeout(startSequence, newsDuration);
        }

        function startProgress(duration) {
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            progressBarContainer.style.display = 'block';
            
            // Forza il browser a ricalcolare lo stile prima di avviare l'animazione
            void progressBar.offsetWidth;
            
            progressBar.style.transition = `width ${duration}ms linear`;
            progressBar.style.width = '100%';
        }

        // Riavvio automatico della pagina tutti i giorni alle 08:55
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 8 && now.getMinutes() === 55) {
                location.reload();
            }
        }, 60000); // Controlla l'orario ogni minuto (60.000 ms)

        window.onload = function() {
            startSequence();
        };
    </script>
</body>
</html>
